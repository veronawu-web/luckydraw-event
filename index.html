<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幸運轉盤｜VIP 同樂會</title>
<style>
  :root{
    --bg:#04100c;
    --g:#4ade80;
    --gs:#a7f3d0;
    --gg:linear-gradient(135deg,#a7f3d0,#4ade80,#10b981);
    --gb:rgba(74,222,128,0.18);
    --card:rgba(167,243,208,0.04);
    --dim:rgba(255,255,255,0.55);
    --gold:#fbbf24;
    --err:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'PingFang TC',-apple-system,'Noto Sans TC',sans-serif;
    background:var(--bg);color:#fff;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:0 16px 90px;
  }

  /* 頂部公告條 */
  .top-banner{width:100%;background:linear-gradient(135deg,rgba(74,222,128,0.12),rgba(251,191,36,0.08));border-bottom:1.5px solid var(--gb);padding:10px 16px;text-align:center;margin:0 -16px;}
  .top-banner .tb-main{font-size:13px;font-weight:800;color:var(--gs);letter-spacing:.5px;}
  .top-banner .tb-main .gem{color:var(--gold);}
  .top-banner .tb-sub{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:1px;}

  /* Header */
  .page-header{text-align:center;padding:22px 0 16px;}
  .eyebrow{display:inline-block;font-size:10px;letter-spacing:5px;font-weight:700;color:var(--g);padding:3px 12px;border:1px solid var(--gb);border-radius:999px;margin-bottom:12px;}
  .page-header h1{font-size:1.9rem;font-weight:900;line-height:1.2;}
  .page-header h1 span{background:var(--gg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .page-header .sub{font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:1px;}

  /* 獎池資訊 */
  .pool{display:flex;gap:8px;width:100%;max-width:420px;margin:6px 0 14px;}
  .pool .pcell{flex:1;background:var(--card);border:1.5px solid var(--gb);border-radius:13px;padding:10px 6px;text-align:center;}
  .pool .pl{font-size:10px;color:var(--dim);letter-spacing:1px;}
  .pool .pv{font-size:17px;font-weight:900;color:var(--gs);margin-top:2px;}
  .pool .pv.gold{color:var(--gold);}

  /* 轉盤 */
  .wheel-wrap{position:relative;width:min(82vw,400px);aspect-ratio:1;margin:6px 0;}
  .pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--gold);z-index:5;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6));}
  .wheel-ring{position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,#10b981,#4ade80,#a7f3d0,#fbbf24,#10b981);filter:blur(3px);opacity:.55;animation:spinRing 14s linear infinite;}
  @keyframes spinRing{to{transform:rotate(360deg);}}
  canvas{position:relative;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 7px var(--bg),0 0 0 9px var(--g),0 20px 50px rgba(0,0,0,.55);transition:transform 5.2s cubic-bezier(.17,.67,.16,.99);}
  .hub{position:absolute;top:50%;left:50%;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);z-index:4;background:radial-gradient(circle at 35% 30%,#eafff3,var(--g) 62%,#0f7a4e);box-shadow:0 5px 16px rgba(0,0,0,.5),inset 0 0 10px rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#04100c;font-size:13px;letter-spacing:1px;}

  /* CTA 按鈕 */
  .spin-btn{margin-top:18px;width:100%;max-width:420px;display:block;border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:18px;letter-spacing:.1em;color:#04100c;padding:18px;border-radius:50px;background:var(--gg);box-shadow:0 10px 30px rgba(74,222,128,.3);transition:transform .12s;}
  .spin-btn:active{transform:scale(.97);}
  .spin-btn:disabled{background:#1e4030;color:var(--dim);box-shadow:none;cursor:default;border:1.5px solid rgba(74,222,128,.2);}

  .seq{margin-top:14px;font-size:12px;color:var(--dim);letter-spacing:1px;}
  .seq b{color:var(--g);font-weight:900;}

  /* Modal */
  .mask{position:fixed;inset:0;background:rgba(4,16,12,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .mask.show{display:flex;}
  .card{width:min(92vw,400px);background:#081a10;border:1.5px solid var(--gb);border-radius:20px;padding:30px 24px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.2,.3,1);}
  @keyframes pop{from{transform:scale(.85);opacity:0;}}
  .sico{width:70px;height:70px;background:var(--gg);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 40px rgba(74,222,128,.35);}
  .card .prizeLabel{font-size:11px;color:var(--dim);letter-spacing:3px;}
  .card .prizeName{font-size:24px;font-weight:900;margin:4px 0 2px;color:#fff;}
  .card .prizeDia{font-size:38px;font-weight:900;margin:2px 0 18px;background:var(--gg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .card .prizeDia span{font-size:15px;color:var(--dim);-webkit-text-fill-color:var(--dim);}
  .card input{width:100%;padding:15px 16px;border-radius:12px;border:1.5px solid var(--gb);background:rgba(0,0,0,.4);color:#fff;font-size:16px;text-align:center;margin-bottom:10px;font-family:inherit;}
  .card input:focus{outline:none;border-color:var(--g);}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:6px;font-weight:600;}
  .card button{width:100%;border:none;cursor:pointer;padding:16px;border-radius:50px;font-family:inherit;font-weight:900;font-size:16px;color:#04100c;background:var(--gg);}
  .card button:disabled{background:#1e4030;color:var(--dim);}
  .status{font-size:12px;margin-top:10px;min-height:16px;color:var(--dim);}
  .status .ok{color:var(--g);}
  .status .pending{color:var(--gold);}

  /* 工具列 */
  .toolbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:90;}
  .toolbar button{background:var(--card);border:1px solid var(--gb);color:var(--dim);font-family:inherit;font-size:12px;padding:9px 16px;border-radius:999px;cursor:pointer;}
  .toolbar button:active{background:rgba(74,222,128,.08);}
</style>
</head>
<body>

<div class="top-banner">
  <div class="tb-main">💎 幸運轉盤抽 <span class="gem">最高 10,000</span> 鑽石</div>
  <div class="tb-sub">現場限定 · 每人限抽一次</div>
</div>

<header class="page-header">
  <div class="eyebrow">VIP 同樂會</div>
  <h1><span>幸運轉盤</span></h1>
  <p class="sub">轉動轉盤 · 贏取鑽石好禮</p>
</header>

<div class="pool">
  <div class="pcell"><div class="pl">獎池</div><div class="pv gold">50,000</div></div>
  <div class="pcell"><div class="pl">名額</div><div class="pv">40</div></div>
  <div class="pcell"><div class="pl">已發出</div><div class="pv" id="given">0</div></div>
</div>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <div class="wheel-ring"></div>
  <canvas id="wheel" width="600" height="600"></canvas>
  <div class="hub">GO</div>
</div>

<button class="spin-btn" id="spinBtn">開始抽獎</button>
<div class="seq">本機第 <b id="seq">1</b> 抽 · 共 40 名額</div>

<div class="mask" id="mask">
  <div class="card">
    <div class="sico">🎉</div>
    <div class="prizeLabel">恭喜抽中</div>
    <div class="prizeName" id="mName">—</div>
    <div class="prizeDia" id="mDia">0 <span>鑽石</span></div>
    <input id="uname" type="text" placeholder="請輸入您的 Username" autocomplete="off">
    <div class="err" id="err"></div>
    <button id="confirmBtn">確認登記</button>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="toolbar">
  <button id="exportBtn">匯出 CSV</button>
  <button id="resetBtn">重置計數</button>
</div>

<script>
/* ============ 設定區 ============ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwN9F4kepmBnHSUKvZ9u9gsmuI-ZFXzQXh-ScuB_ukLlTqZrypwjeLns0Dfzepurmtc/exec";
const JACKPOT_AT = 25;
const PRIZES = [
  { name:"頭獎", dia:10000, weight:0,  jackpot:true,  color:"#fbbf24" },
  { name:"大獎", dia:5000,  weight:4,                 color:"#f59e0b" },
  { name:"中獎", dia:3000,  weight:7,                 color:"#34d399" },
  { name:"小獎", dia:2000,  weight:10,                color:"#4ade80" },
  { name:"普獎", dia:1000,  weight:16,                color:"#10b981" },
  { name:"安慰", dia:500,   weight:22,                color:"#059669" },
  { name:"銘謝", dia:300,   weight:22,                color:"#047857" },
  { name:"銘謝", dia:200,   weight:18,                color:"#065f46" },
];

/* ============ 狀態 ============ */
let seq=1, given=0, spinning=false, currentRotation=0, pendingPrize=null;
const usedNames=new Set(), records=[], failedQueue=[];

/* ============ 畫轉盤 ============ */
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const N=PRIZES.length,seg=(Math.PI*2)/N,R=cv.width/2;
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<N;i++){
    const a0=i*seg-Math.PI/2-seg/2,a1=a0+seg;
    ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-6,a0,a1);ctx.closePath();
    const p=PRIZES[i];
    const g=ctx.createRadialGradient(R,R,40,R,R,R);
    g.addColorStop(0,shade(p.color,28));g.addColorStop(1,p.color);
    ctx.fillStyle=g;ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle="rgba(4,16,12,.85)";ctx.stroke();
    ctx.save();ctx.translate(R,R);ctx.rotate(a0+seg/2);
    ctx.textAlign="right";
    ctx.fillStyle = p.dia>=3000 ? "#04100c" : "#eafff3";
    ctx.font="900 30px 'PingFang TC',sans-serif";
    ctx.fillText(p.dia.toLocaleString(),R-30,-6);
    ctx.font="700 17px 'PingFang TC',sans-serif";
    ctx.fillText("鑽石",R-30,19);
    ctx.restore();
  }
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=Math.min(255,(n>>16)+amt),g=Math.min(255,((n>>8)&255)+amt),b=Math.min(255,(n&255)+amt);return`rgb(${r},${g},${b})`;}
draw();

/* ============ 抽獎邏輯 ============ */
function pickIndex(){
  if(seq===JACKPOT_AT) return PRIZES.findIndex(p=>p.jackpot);
  const pool=PRIZES.map((p,i)=>({i,w:p.jackpot?0:p.weight}));
  const total=pool.reduce((s,o)=>s+o.w,0);
  let r=Math.random()*total;
  for(const o of pool){if(r<o.w)return o.i;r-=o.w;}
  return pool[pool.length-1].i;
}
const spinBtn=document.getElementById('spinBtn');
spinBtn.addEventListener('click',()=>{
  if(spinning)return;
  if(seq>40){alert("40 個名額已抽完。");return;}
  spinning=true;spinBtn.disabled=true;
  const idx=pickIndex();pendingPrize=PRIZES[idx];
  const targetDeg=360*8+(360-idx*(360/N));
  currentRotation+=targetDeg;
  cv.style.transform=`rotate(${currentRotation}deg)`;
  setTimeout(()=>{spinning=false;showResult(pendingPrize);},5300);
});

/* ============ Modal + 登記 ============ */
const mask=document.getElementById('mask');
function showResult(p){
  document.getElementById('mName').textContent=p.name;
  document.getElementById('mDia').innerHTML=p.dia.toLocaleString()+' <span>鑽石</span>';
  document.getElementById('uname').value="";
  document.getElementById('err').textContent="";
  document.getElementById('status').textContent="";
  document.getElementById('confirmBtn').disabled=false;
  mask.classList.add('show');
  setTimeout(()=>document.getElementById('uname').focus(),200);
}
document.getElementById('confirmBtn').addEventListener('click',submit);
async function submit(){
  const name=document.getElementById('uname').value.trim();
  const err=document.getElementById('err');
  if(!name){err.textContent="請輸入 Username";return;}
  if(usedNames.has(name.toLowerCase())){err.textContent="此 Username 已抽過，不可重複";return;}
  const btn=document.getElementById('confirmBtn'),status=document.getElementById('status');
  btn.disabled=true;err.textContent="";status.textContent="登記中…";
  const rec={seq,username:name,prize:pendingPrize.name,diamonds:pendingPrize.dia,time:new Date().toISOString()};
  const ok=await sendToSheet(rec);
  if(!ok){failedQueue.push(rec);status.innerHTML='<span class="pending">寫入失敗，已暫存（結束可匯出 CSV 補單）</span>';}
  else{status.innerHTML='<span class="ok">✓ 已寫入試算表</span>';}
  usedNames.add(name.toLowerCase());records.push(rec);
  given+=pendingPrize.dia;document.getElementById('given').textContent=given.toLocaleString();
  seq++;document.getElementById('seq').textContent=seq;
  setTimeout(()=>{mask.classList.remove('show');spinBtn.disabled=(seq>40);spinBtn.textContent=seq>40?"已抽完":"開始抽獎";},900);
}

/* ============ 寫入 Google Sheet ============ */
async function sendToSheet(rec,retry=1){
  if(!GAS_URL||GAS_URL.startsWith("PASTE_")){console.warn("GAS_URL 未設定");return false;}
  try{
    const res=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)});
    if(!res.ok)throw new Error("HTTP "+res.status);
    return true;
  }catch(e){
    if(retry>0){await new Promise(r=>setTimeout(r,800));return sendToSheet(rec,retry-1);}
    console.error("寫入失敗",e);return false;
  }
}

/* ============ CSV / 重置 ============ */
document.getElementById('exportBtn').addEventListener('click',()=>{
  if(records.length===0){alert("尚無紀錄");return;}
  const head="seq,username,prize,diamonds,time,write_status\n";
  const rows=records.map(r=>`${r.seq},"${r.username}",${r.prize},${r.diamonds},${r.time},${failedQueue.includes(r)?"FAILED":"OK"}`).join("\n");
  const blob=new Blob(["\uFEFF"+head+rows],{type:"text/csv;charset=utf-8"});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`lucky_draw_${Date.now()}.csv`;a.click();
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm("確定要重置計數？這會清空本機紀錄與第幾抽。"))return;
  seq=1;given=0;usedNames.clear();records.length=0;failedQueue.length=0;
  document.getElementById('seq').textContent=1;document.getElementById('given').textContent=0;
  spinBtn.disabled=false;spinBtn.textContent="開始抽獎";
});
</script>
</body>
</html>
